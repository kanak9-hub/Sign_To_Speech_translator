<!DOCTYPE html>
<html>
<head>
  <title>3D Sign Language Avatar</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: sans-serif; }
    #ui-container { position: absolute; top: 20px; width: 100%; text-align: center; color: white; pointer-events: none; }
    button { pointer-events: auto; font-size: 20px; padding: 15px 30px; background-color: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s; }
    button:hover { transform: scale(1.05); }
    #message { margin-top: 15px; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
  </style>
</head>
<body>

  <div id="ui-container">
    <button id="talkButton">Start Conversation 🎤</button>
    <div id="message">Press the button to start!</div>
  </div>

  <script>
    // 1. SETUP THE 3D WORLD
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a1a1a, 0.05);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 2, 8);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const spotLight = new THREE.SpotLight(0x00ff00, 1);
spotLight.position.set(0, 10, 5);
scene.add(spotLight);

// 2. THE DICTIONARY (Matching words to Robot Animation Numbers)
const dictionary = {
    "HELLO": 12, "HI": 12,
    "YES": 13, "AGREE": 13,
    "NO": 4, "STOP": 4,
    "GOOD": 9, "AWESOME": 9, "GREAT": 9,
    "DANCE": 0, "PARTY": 0,
    "JUMP": 3
};

// 3. LOAD THE ROBOT
let mixer;
let allActions = [];
let currentAction;
let isPlayingSequence = false;
let wordQueue = [];

const loader = new THREE.GLTFLoader();
loader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/models/gltf/RobotExpressive/RobotExpressive.glb', function (gltf) {
    const avatar = gltf.scene;
    avatar.position.y = -2;
    scene.add(avatar);
    
    mixer = new THREE.AnimationMixer(avatar);
    
    // Save all 14 animations into our allActions list
    for(let i = 0; i < gltf.animations.length; i++) {
        allActions.push(mixer.clipAction(gltf.animations[i]));
    }
    
    // Start by playing Idle (Animation 2)
    currentAction = allActions[2];
    currentAction.play();

    // SUPER IMPORTANT: Listen for when an animation finishes!
    mixer.addEventListener('finished', function(e) {
        playNextWord();
    });
});

const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    if (mixer) mixer.update(clock.getDelta());
    renderer.render(scene, camera);
}
animate();

// 4. THE ANIMATION QUEUE ENGINE
function processSentence(wordList) {
    // Look at every word you said. If it's in our dictionary, add it to the line!
    for(let i = 0; i < wordList.length; i++) {
        let word = wordList[i];
        if (dictionary[word] !== undefined) {
            wordQueue.push(dictionary[word]);
        }
    }

    // If the robot is just breathing, tell him to start the sequence!
    if (isPlayingSequence === false && wordQueue.length > 0) {
        isPlayingSequence = true;
        playNextWord();
    }
}

function playNextWord() {
    // If the line is empty, we are done! Go back to breathing.
    if (wordQueue.length === 0) {
        let idleAction = allActions[2];
        idleAction.reset();
        idleAction.setLoop(THREE.LoopRepeat); // Breathe forever
        idleAction.play();
        currentAction.crossFadeTo(idleAction, 0.5, false);
        currentAction = idleAction;
        isPlayingSequence = false;
        return;
    }

    // Grab the next animation number from the front of the line
    let nextAnimNumber = wordQueue.shift();
    let nextAction = allActions[nextAnimNumber];

    // Tell it to only play ONE TIME (so the 'finished' event triggers)
    nextAction.setLoop(THREE.LoopOnce, 1);
    nextAction.clampWhenFinished = true; // Hold the final pose

    // Smoothly blend to the next move!
    nextAction.reset();
    nextAction.play();
    currentAction.crossFadeTo(nextAction, 0.2, false);
    currentAction = nextAction;
}

// 5. WALKIE-TALKIE CONNECTION
const socket = new WebSocket('ws://localhost:8765');
const talkButton = document.getElementById("talkButton");
const messageDisplay = document.getElementById("message");
let isListening = false;

talkButton.onclick = function() {
    if (!isListening) {
        socket.send("START");
        isListening = true;
        messageDisplay.innerText = "Listening... Speak now!";
        talkButton.style.backgroundColor = "#f44336"; 
        talkButton.innerText = "Stop Listening 🛑";
    } else {
        socket.send("STOP");
        isListening = false;
        messageDisplay.innerText = "Conversation Ended.";
        talkButton.style.backgroundColor = "#4CAF50";
        talkButton.innerText = "Start Conversation 🎤";
    }
};

socket.onmessage = function(event) {
    const secretMessage = JSON.parse(event.data);
    messageDisplay.innerText = "You said: " + secretMessage.fullText;
    
    // Send the chopped up words to our Queue Engine!
    if (secretMessage.words) {
        processSentence(secretMessage.words);
    }
};
</script>
</body>
</html>
